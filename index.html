<style>
:root{--bg:#0a0807;--ember:#ff6a2b;--crimson:#a3161c;--gold:#d8ad62;--ink:#efe6d6;--mute:#9b8f80}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100vh;min-height:100svh;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(55% 40% at 55% 50%,rgba(163,22,28,.30),transparent 70%),
  radial-gradient(35% 25% at 60% 48%,rgba(255,106,43,.16),transparent 70%),
  radial-gradient(120% 70% at 50% 125%,rgba(255,90,30,.20),transparent 60%),
  linear-gradient(#090706,#0d0908 55%,#160b07)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22220%22%20height%3D%22220%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%22.85%22%20numOctaves%3D%222%22%20stitchTiles%3D%22stitch%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url(%23n)%22%2F%3E%3C%2Fsvg%3E")}
.ghost{position:fixed;left:50%;top:50%;z-index:1;pointer-events:none;transform:translate(-50%,-54%);font-family:"Yuji Syuku","Noto Serif JP",serif;font-size:min(78vh,92vw);line-height:1;color:rgba(255,140,80,.045);user-select:none}
.embers{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.embers i{position:absolute;bottom:-12px;border-radius:50%;background:#ffb27a;box-shadow:0 0 6px 2px rgba(255,110,40,.65);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}70%{opacity:.55}100%{transform:translate(var(--dx),-108vh);opacity:0}}

header,main,footer{position:relative;z-index:3}
header{display:flex;justify-content:center;padding:clamp(28px,6vh,56px) 20px 0}
.brand{display:flex;align-items:center;gap:16px}
.seal{writing-mode:vertical-rl;font-family:"Yuji Syuku","Noto Serif JP",serif;font-size:17px;line-height:1.05;color:#f5e7d0;background:var(--crimson);padding:7px 5px;border-radius:3px;box-shadow:inset 0 0 0 1.5px rgba(245,231,208,.55),0 6px 20px rgba(163,22,28,.35);transform:rotate(-4deg)}
.wordmark{display:flex;flex-direction:column;align-items:center;font-family:Cinzel,serif;text-transform:uppercase}
.w1{font-weight:600;font-size:clamp(15px,2.2vw,20px);letter-spacing:.38em;margin-right:-.38em;color:var(--ink)}
.w2{display:flex;align-items:center;gap:12px;margin-top:6px;font-weight:500;font-size:11px;letter-spacing:.62em;margin-right:-.62em;color:var(--gold)}
.w2::before,.w2::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.w2::after{transform:scaleX(-1)}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px 32px}
.katana{display:block;width:min(1100px,100%);height:auto;margin:0 auto clamp(10px,3vh,30px);overflow:visible;clip-path:inset(-20% 100% -20% 0);animation:draw 1.7s cubic-bezier(.7,0,.2,1) .25s forwards}
@keyframes draw{to{clip-path:inset(-20% -2% -20% 0)}}
.katana .glint{animation:glint 6.5s ease-in-out 2.1s infinite}
@keyframes glint{0%{transform:translateX(320px)}38%,100%{transform:translateX(1460px)}}

.eyebrow{font-family:Cinzel,serif;font-size:12px;letter-spacing:.5em;margin-right:-.5em;text-transform:uppercase;color:var(--gold);opacity:.85}
h1{font-family:Cinzel,serif;font-weight:700;font-size:clamp(2.5rem,8.4vw,6.6rem);line-height:1;letter-spacing:.1em;margin:14px -.1em 0 0;text-transform:uppercase;background:linear-gradient(180deg,#fff4de 0%,#ecc67f 42%,#b7762c 74%,#6a3812 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(255,106,43,.22))}
.lede{margin-top:clamp(14px,2.6vh,22px);font-size:clamp(1.2rem,2.4vw,1.6rem);font-style:italic;color:var(--ink);opacity:.92}
.sub{margin-top:8px;font-size:clamp(1rem,1.8vw,1.2rem);color:var(--mute)}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:clamp(22px,4vh,36px);padding:10px 20px;border:1px solid rgba(216,173,98,.28);border-radius:999px;background:rgba(20,12,9,.55);backdrop-filter:blur(6px);font-family:Cinzel,serif;font-size:11px;letter-spacing:.32em;margin-right:0;text-transform:uppercase;color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px 2px rgba(255,106,43,.7);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}

footer{padding:0 20px clamp(20px,4vh,36px);text-align:center;font-family:Cinzel,serif;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);opacity:.75}

.reveal{opacity:0;transform:translateY(14px);animation:up 1s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:1.1s}.d2{animation-delay:1.35s}.d3{animation-delay:1.55s}.d4{animation-delay:1.8s}.d0{animation-delay:.1s}
@keyframes up{to{opacity:1;transform:none}}

@media (max-width:560px){.brand{gap:12px}.seal{font-size:15px}.w1{letter-spacing:.28em;margin-right:-.28em}.status{letter-spacing:.24em}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.katana{clip-path:none}.reveal{opacity:1;transform:none}}
</style>
