<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--seo-->
  <!-- Filled in by the server (store.py): title, description, robots, canonical, Open Graph, JSON-LD.
       The robots tag below only applies to this file opened on its own. -->
  <title>Shop | Dragon Spring Swords</title>
  <meta name="description" content="Every katana, sword, kitchen knife and cutlery set in the Dragon Spring vault." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#faf8f4" />
  <meta property="og:site_name" content="Dragon Spring Swords" />
  <meta property="og:title" content="Shop | Dragon Spring Swords" />
  <meta property="og:description" content="Every katana, sword, kitchen knife and cutlery set in the Dragon Spring vault." />
  <meta property="og:image" content="/assets/img/brand/og-logo.jpg" />
  <!--/seo-->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="/assets/img/brand/favicon-96.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="/assets/img/brand/apple-touch-icon.png" />
  <link rel="preload" href="/assets/fonts/zen-kaku-gothic-new-v19-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/shippori-mincho-v17-500-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/cinzel-var-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script>
    // Motion is opt-in: elements start hidden only when JS runs and the
    // visitor has not asked for reduced motion.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion-ok');
    }
  </script>
</head>
<body data-page="shop">
  <div id="layout-top"></div>

  <main id="main" style="position:relative">
    <section class="shell shop-head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span aria-current="page">Shop</span></nav>
      <!--ssr:shophead--><h1 class="display-lg" id="shop-title">All pieces</h1>
      <p class="shop-lede" id="shop-lede"></p><!--/ssr:shophead-->
    </section>
    <section class="shell shop-body" aria-label="Products">
      <div class="shop-toolbar">
        <div class="chips" id="shop-chips" role="group" aria-label="Filter by category"><!--ssr:chips--><!--/ssr:chips--></div>
        <div class="shop-tools">
          <form id="shop-search-form" class="shop-search" role="search">
            <svg class="icon-sm" aria-hidden="true"><use href="#i-search"/></svg>
            <label for="shop-search" class="sr-only">Search the shop</label>
            <input id="shop-search" type="search" placeholder="Search blades…" autocomplete="off" />
          </form>
          <label class="shop-sort"><span class="sr-only">Sort by</span>
            <select id="shop-sort">
              <option value="featured">Featured</option>
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
      </div>
      <p class="shop-count" id="shop-count" aria-live="polite"><!--ssr:count--><!--/ssr:count--></p>
      <h2 class="sr-only">Products</h2>
      <div class="product-grid" id="shop-grid"><!--ssr:grid--><!--/ssr:grid--></div>
      <p class="currency-note" hidden>Prices are converted from US dollars at today’s rate. The final amount is confirmed when you order.</p>
    </section>
  </main>

  <div id="layout-bottom"></div>

  <script src="/assets/js/content.js"></script>
  <!-- Products, photos, reviews, pages, settings and exchange rates from the admin. -->
  <script src="/catalog.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/support.js" defer></script>
</body>
</html>
